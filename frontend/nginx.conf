server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A bare `proxy_pass http://api:8000/;` resolves "api" once, at config
    # load, and caches that IP -- so a later `docker compose up --build api`
    # (or any container recreation) leaves this proxy pointing at a dead IP
    # until nginx itself restarts, surfacing as a 502. Route through a
    # variable so nginx re-resolves via Docker's embedded DNS on each
    # `valid` interval instead of caching indefinitely.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # proxy_pass with a variable upstream (needed above so nginx
        # re-resolves "api" instead of caching its IP) stops nginx from
        # doing its usual "replace the matched location prefix" rewrite, so
        # the /api/ prefix has to be stripped explicitly or it gets
        # forwarded straight through to a backend that has no /api prefix
        # of its own.
        # `set` must come before `rewrite ... break` -- break halts the
        # rewrite module's directive processing for this location, so a
        # `set` placed after it never runs and leaves $api_upstream
        # uninitialized.
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

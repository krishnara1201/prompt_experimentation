[project]
name = "prompt-experimentation-backend"
version = "0.1.0"
description = "Model adapter layer for the LLM prompt-experimentation platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "fastapi[standard]>=0.140.0",
    "celery[redis]>=5.6.3",
    "scipy>=1.18.1",
    "pymc>=6.3.1",
    "mcp>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# The active evaluation task (a pack under backend/tasks/). Default:
# financial_sentiment. `pe tasks` lists them; `pe seed --task <name>` seeds one.
task: financial_sentiment

# Pricing figures below are illustrative — verify against each provider's
# current pricing page before using cost_estimate_usd for real comparisons.
arms:
  - name: qwen3-8b-local
    adapter: openai_compatible
    # localhost is correct for the non-Docker flow. Running under Docker?
    # Don't edit this — set OLLAMA_BASE_URL in .env instead (it redirects
    # every local-Ollama arm/judge below). See the repo-root README.
    base_url: http://localhost:11434/v1
    model: qwen3:8b
    max_tokens: 1024
    # qwen3:8b runs with its default thinking mode on -- a single call can
    # take 20-40s. Wide timeout so a slow think isn't recorded as a failure.
    timeout: 600

  # Phase 7: the QLoRA fine-tune of qwen3:8b on Financial PhraseBank
  # (`pe finetune train|export`). Same Ollama server, same q4_k_m quant as
  # the base arm above -- a fair quant-to-quant comparison. This arm FAILs
  # until you've built the `ft-qwen3-8b` Ollama model with
  # `pe finetune export` (needs the optional `training` extra + a GPU).
  - name: ft-qwen3-8b-local
    adapter: openai_compatible
    base_url: http://localhost:11434/v1
    model: ft-qwen3-8b
    max_tokens: 1024
    timeout: 600

  # Phase 8 / Deliverable 2: a prompt A/B on the AG News topic-classification
  # task pack. Same model (qwen3:8b), same `reasoning_effort: none` (Qwen3's
  # native thinking OFF), differing ONLY in `prompt_template` — so the paired
  # stats compare a terse "just the label" instruction against a
  # "reason step by step" one head to head. Run with:
  #   pe seed --task ag_news
  #   pe run --task ag_news -a ag-news-terse -a ag-news-cot -n 120 -r 2
  - name: ag-news-terse
    adapter: openai_compatible
    base_url: http://localhost:11434/v1
    model: qwen3:8b
    max_tokens: 512
    timeout: 600
    extra_body:
      reasoning_effort: none
    prompt_template: |-
      Classify the topic of the news snippet below as exactly one of: World, Sports, Business, Sci/Tech. Answer with only the label.

      Snippet: {text}

  - name: ag-news-cot
    adapter: openai_compatible
    base_url: http://localhost:11434/v1
    model: qwen3:8b
    max_tokens: 512
    timeout: 600
    extra_body:
      reasoning_effort: none
    prompt_template: |-
      Classify the topic of the news snippet below as exactly one of: World, Sports, Business, Sci/Tech. Reason step by step about what the snippet is mainly about, then finish with a final line formatted exactly as 'Label: <one of World, Sports, Business, Sci/Tech>'.

      Snippet: {text}

  - name: gpt-4o-mini
    adapter: openai_compatible
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    max_tokens: 1024
    price_per_1m_input: 0.15
    price_per_1m_output: 0.60

  - name: gemini-flash
    adapter: openai_compatible
    # Gemini's OpenAI-compatible shim. Auth is a plain Bearer token, so the
    # existing openai_compatible adapter works unchanged.
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY
    max_tokens: 1024
    price_per_1m_input: 0.30
    price_per_1m_output: 2.50

  - name: claude-haiku
    adapter: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    price_per_1m_input: 1.00
    price_per_1m_output: 5.00

# A/B-ing prompts: give two arms the same adapter/model but a different
# `prompt_template`. Every arm still sees the same eval examples, so the
# paired stats compare the prompts head to head. The template must contain
# `{text}` (the eval-example sentence); omit it entirely to use the shared
# default in app/eval_prompt.py.
#
#   - name: qwen3-terse-prompt
#     adapter: openai_compatible
#     base_url: http://localhost:11434/v1
#     model: qwen3:8b
#     prompt_template: "Sentiment (positive/negative/neutral) of: {text}"
#
#   - name: qwen3-cot-prompt
#     adapter: openai_compatible
#     base_url: http://localhost:11434/v1
#     model: qwen3:8b
#     prompt_template: |
#       Classify the financial sentiment of the sentence below as positive,
#       negative, or neutral. Think step by step, then end with the label.
#
#       Sentence: {text}

# Subscription-seat CLI arms — opt-in, not enabled by default. Uncomment
# once you've authenticated the CLI (`claude login` / `codex login`) AND
# started the dedicated low-concurrency worker for the `subscription_cli`
# queue (see "Subscription-seat CLI arms" in backend/README.md) — otherwise
# these arms' tasks queue forever with nothing consuming them.
#
#   - name: claude-code-sonnet-subscription
#     adapter: claude_code_cli
#     model: sonnet
#
#   - name: codex-subscription
#     adapter: codex_cli
#     model: gpt-5-codex

# LLM-as-judge (Phase 3). Configured separately from the eval arms and never
# scored as one. Default: the local Ollama model — keyless, offline, no
# per-call cost, works out of the box in the same setup the local arm needs.
#
# For a real comparison, point the judge at a model that is BOTH stronger
# than every arm under test AND not itself an arm (LLM-as-judge
# self-preference is a validity risk — see "Watch for judge/arm model
# overlap" in backend/README.md). Then re-run the calibration workflow. E.g.:
#
#   judge:
#     adapter: openai_compatible
#     base_url: https://api.openai.com/v1
#     model: gpt-4o
#     api_key_env: OPENAI_API_KEY
#     max_tokens: 1024
judge:
  adapter: openai_compatible
  base_url: http://localhost:11434/v1
  model: qwen3:8b
  max_tokens: 1024

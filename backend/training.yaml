# The single config surface for Phase 7 fine-tuning (mirrors arms.yaml).
# `pe finetune prep|train|export` all read this file.

run_name: qwen3-8b-finsent-lora

# Which task pack (backend/tasks/<name>/) this fine-tune targets. Its
# label set + eval prompt drive the SFT records; the leakage guard still
# checks against every seeded eval_example regardless of task.
task: financial_sentiment

# HF weights to fine-tune (full/4bit, NOT the Ollama GGUF).
base_model: unsloth/Qwen3-8B

# Financial PhraseBank, full 50%-agree corpus (4846 sentences) as a
# script-free parquet mirror. The all-agree eval set is a subset of it, so
# the leakage guard drops that overlap (~2260 rows) and leaves ~2580
# lower-agreement sentences to train on -- disjoint from the eval set by
# construction. Downloaded at runtime, not vendored
# (CC BY-NC-SA 3.0, Malo et al. 2014).
#
# NOTE: the canonical `takala/financial_phrasebank` still ships a loading
# script, which `datasets` >= 4 refuses ("Dataset scripts are no longer
# supported"). Mirrors that keep the per-agreement configs
# (`sentences_75agree` etc.) are all script-based for the same reason.
# `odedovadia/financial_phrasebank_split` is plain parquet, original Malo
# tokenisation (matches the seeded eval text), int labels 0/1/2.
source_dataset: odedovadia/financial_phrasebank_split
source_config: default

max_seq_len: 512

lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

epochs: 3
learning_rate: 0.0002
batch_size: 8
grad_accum: 2
seed: 42

val_fraction: 0.1
balance_neutral: false
min_pool_size: 500

# q4_k_m matches the base local arm's quantization for a clean
# base-vs-fine-tuned comparison (see the spec's Risk 5).
gguf_quant: q4_k_m
ollama_tag: ft-qwen3-8b

output_dir: training/artifacts/qwen3-8b-finsent-lora
